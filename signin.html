<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajang News Hub — Sign In</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <h1>Ajang News Hub</h1>
        <a class="back-link" href="index.html">&larr; Back to headlines</a>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="login" type="button">Sign In</button>
        <button class="tab-btn" data-tab="signup" type="button">Sign Up</button>
      </div>

      <form id="login-form" class="stack">
        <div>
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required autocomplete="email" />
        </div>
        <div>
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required autocomplete="current-password" />
        </div>
        <div class="form-error" id="login-error"></div>
        <button type="submit" class="btn btn-primary">Sign In</button>
        <button type="button" class="btn btn-ghost" id="demo-login">Continue with demo account</button>
      </form>

      <form id="signup-form" class="stack hidden">
        <div>
          <label for="signup-name">Full name</label>
          <input type="text" id="signup-name" required autocomplete="name" />
        </div>
        <div>
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" required autocomplete="email" />
        </div>
        <div>
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" required minlength="6" autocomplete="new-password" />
        </div>
        <div class="form-error" id="signup-error"></div>
        <button type="submit" class="btn btn-primary">Create account</button>
      </form>

    </div>

    <div class="auth-footer">
      <span class="footer-label">Follow me on</span>
      <div class="social-links">
        <!-- Replace the # hrefs below with your real profile URLs -->
        <a class="social-link" href="#" aria-label="TikTok" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.82c-.9-.98-1.4-2.26-1.4-3.62h-3.45v13.6c0 1.66-1.35 3-3.01 3-1.66 0-3.01-1.34-3.01-3s1.35-3 3.01-3c.31 0 .61.05.9.14V9.4a6.65 6.65 0 0 0-.9-.06 6.48 6.48 0 0 0 0 12.96 6.48 6.48 0 0 0 6.48-6.48V8.93a9.15 9.15 0 0 0 5.36 1.72V7.2c-1.5 0-2.89-.51-3.98-1.38Z"/></svg>
        </a>
        <a class="social-link" href="#" aria-label="LinkedIn" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124zM7.119 20.452H3.554V9h3.565v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003Z"/></svg>
        </a>
        <a class="social-link" href="#" aria-label="X (Twitter)" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>

      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
