# Example nginx site config for Web01 / Web02.
# Copy to /etc/nginx/sites-available/global-news-hub.conf, symlink into
# sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.

server {
    listen 80;
    server_name _;

    root /var/www/global-news-hub;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Small health check endpoint the load balancer can poll.
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
