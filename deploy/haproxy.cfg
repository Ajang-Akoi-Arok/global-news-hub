# Example HAProxy config for Lb01, load-balancing between Web01 and Web02.
# Replace the IP addresses with your actual Web01 / Web02 private IPs and
# reload with: sudo systemctl reload haproxy (after `haproxy -c -f ...`).

global
    daemon
    maxconn 256

defaults
    mode    http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_front
    bind *:80
    default_backend web_servers

backend web_servers
    balance roundrobin
    option httpchk GET /health
    server web01 <WEB01_IP>:80 check
    server web02 <WEB02_IP>:80 check

# Optional: expose HAProxy's stats page for verifying traffic distribution.
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
