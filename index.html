  <title>World Realtime News</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">World Realtime News</div>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search headlines..." />
      </div>
    </div>
  </header>

  <main class="container">
    <div class="welcome-banner">
      <p class="welcome-eyebrow">Welcome to World Realtime News</p>
      <h1 class="welcome-headline">Stay on top of the stories that matter to you.</h1>
    </div>

    <div class="status-banner error hidden" id="error-banner">
      <span id="error-message">Something went wrong.</span>
      <button class="btn btn-ghost" id="retry-btn" type="button">Retry</button>
    </div>

    <div class="hero-skeleton" id="hero-skeleton">
      <div class="skeleton-thumb hero-skeleton-media"></div>
      <div class="hero-skeleton-content">
        <div class="skeleton-line" style="width: 40%;"></div>
        <div class="skeleton-line" style="width: 90%; height: 22px; margin-top: 18px;"></div>
        <div class="skeleton-line" style="width: 70%; height: 22px;"></div>
        <div class="skeleton-line" style="margin-top: 18px;"></div>
        <div class="skeleton-line short"></div>
      </div>
    </div>

    <section class="hero-carousel-wrap hidden" id="hero-section">
      <div class="hero-carousel-track" id="hero-carousel-track"></div>
    </section>

    <div class="section-header">
      <h2 class="section-title">Latest Articles</h2>
      <a class="see-all" href="#" id="see-all-link">See all &rarr;</a>
    </div>

    <div class="carousel-wrap">
      <div id="latest-cards-skeleton" class="carousel-track"></div>
      <div id="latest-cards-grid" class="carousel-track hidden"></div>
    </div>

    <div class="toolbar">
      <div class="chips" id="category-chips">
        <button class="chip active" data-category="all">All</button>
        <button class="chip" data-category="world">World</button>
        <button class="chip" data-category="business">Business</button>
        <button class="chip" data-category="technology">Technology</button>
        <button class="chip" data-category="sports">Sports</button>
        <button class="chip" data-category="health">Health</button>
        <button class="chip" data-category="science">Science</button>
        <button class="chip" data-category="entertainment">Entertainment</button>
      </div>

      <div class="toolbar-right">
        <div class="view-tabs">
          <button class="view-tab active" data-view="all">All articles</button>
          <button class="view-tab" data-view="saved">Saved</button>
        </div>
