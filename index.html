<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajang News Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">Ajang News Hub</div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search headlines..." />
    </div>
  </header>

  <main class="container">
    <div class="welcome-banner">
      <p class="welcome-eyebrow">Welcome to Ajang News Hub</p>
      <h1 class="welcome-headline">Stay on top of the stories that matter to you.</h1>
    </div>

    <div class="status-banner error hidden" id="error-banner">
      <span id="error-message">Something went wrong.</span>
      <button class="btn btn-ghost" id="retry-btn" type="button">Retry</button>
    </div>

    <div class="hero-skeleton" id="hero-skeleton">
      <div class="skeleton-thumb hero-skeleton-media"></div>
      <div class="hero-skeleton-content">
        <div class="skeleton-line" style="width: 40%;"></div>
        <div class="skeleton-line" style="width: 90%; height: 22px; margin-top: 18px;"></div>
        <div class="skeleton-line" style="width: 70%; height: 22px;"></div>
        <div class="skeleton-line" style="margin-top: 18px;"></div>
        <div class="skeleton-line short"></div>
      </div>
    </div>

    <section class="hero-carousel-wrap hidden" id="hero-section">
      <div class="hero-carousel-track" id="hero-carousel-track"></div>
    </section>

    <div class="section-header">
      <h2 class="section-title">Latest Articles</h2>
      <a class="see-all" href="#" id="see-all-link">See all &rarr;</a>
    </div>

    <div class="carousel-wrap">
      <div id="latest-cards-skeleton" class="carousel-track"></div>
      <div id="latest-cards-grid" class="carousel-track hidden"></div>
    </div>

    <div class="toolbar">
      <div class="chips" id="category-chips">
        <button class="chip active" data-category="all">All</button>
        <button class="chip" data-category="world">World</button>
        <button class="chip" data-category="business">Business</button>
        <button class="chip" data-category="technology">Technology</button>
        <button class="chip" data-category="sports">Sports</button>
        <button class="chip" data-category="health">Health</button>
        <button class="chip" data-category="science">Science</button>
        <button class="chip" data-category="entertainment">Entertainment</button>
      </div>

      <div class="toolbar-right">
        <div class="view-tabs">
          <button class="view-tab active" data-view="all">All articles</button>
          <button class="view-tab" data-view="saved">Saved</button>
        </div>
        <select id="country-select">
          <option value="">All countries</option>
          <option value="ar">Argentina</option>
          <option value="au">Australia</option>
          <option value="at">Austria</option>
          <option value="bd">Bangladesh</option>
          <option value="be">Belgium</option>
          <option value="bw">Botswana</option>
          <option value="br">Brazil</option>
          <option value="bg">Bulgaria</option>
          <option value="ca">Canada</option>
          <option value="cl">Chile</option>
          <option value="cn">China</option>
          <option value="co">Colombia</option>
          <option value="cu">Cuba</option>
          <option value="cz">Czechia</option>
          <option value="eg">Egypt</option>
          <option value="ee">Estonia</option>
          <option value="et">Ethiopia</option>
          <option value="fi">Finland</option>
          <option value="fr">France</option>
          <option value="de">Germany</option>
          <option value="gh">Ghana</option>
          <option value="gr">Greece</option>
          <option value="hk">Hong Kong</option>
          <option value="hu">Hungary</option>
          <option value="in">India</option>
          <option value="id">Indonesia</option>
          <option value="ie">Ireland</option>
          <option value="il">Israel</option>
          <option value="it">Italy</option>
          <option value="jp">Japan</option>
          <option value="ke">Kenya</option>
          <option value="lv">Latvia</option>
          <option value="lb">Lebanon</option>
          <option value="lt">Lithuania</option>
          <option value="my">Malaysia</option>
          <option value="mx">Mexico</option>
          <option value="ma">Morocco</option>
          <option value="na">Namibia</option>
          <option value="nl">Netherlands</option>
          <option value="nz">New Zealand</option>
          <option value="ng">Nigeria</option>
          <option value="no">Norway</option>
          <option value="pk">Pakistan</option>
          <option value="pe">Peru</option>
          <option value="ph">Philippines</option>
          <option value="pl">Poland</option>
          <option value="pt">Portugal</option>
          <option value="ro">Romania</option>
          <option value="ru">Russia</option>
          <option value="sa">Saudi Arabia</option>
          <option value="sn">Senegal</option>
          <option value="sg">Singapore</option>
          <option value="sk">Slovakia</option>
          <option value="si">Slovenia</option>
          <option value="za">South Africa</option>
          <option value="kr">South Korea</option>
          <option value="es">Spain</option>
          <option value="se">Sweden</option>
          <option value="ch">Switzerland</option>
          <option value="tw">Taiwan</option>
          <option value="tz">Tanzania</option>
          <option value="th">Thailand</option>
          <option value="tr">Turkey</option>
          <option value="ug">Uganda</option>
          <option value="ua">Ukraine</option>
          <option value="ae">United Arab Emirates</option>
          <option value="gb">United Kingdom</option>
          <option value="us">United States</option>
          <option value="ve">Venezuela</option>
          <option value="vn">Vietnam</option>
          <option value="zw">Zimbabwe</option>
        </select>
        <select id="sort-select">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="source">Source A–Z</option>
          <option value="title">Title A–Z</option>
        </select>
        <button class="btn btn-ghost" id="simulate-error-btn" type="button" title="Demo: simulate an API failure">
          Simulate error
        </button>
      </div>
    </div>

    <div id="results-count" style="color: var(--text-dim); font-size: 13px; margin-bottom: 14px;"></div>

    <div id="loading-grid" class="article-list hidden"></div>
    <div id="article-grid" class="article-list"></div>

    <div class="empty-state hidden" id="empty-state">
      <p>No articles match your filters.</p>
    </div>

    <footer class="site-footer">
      <span class="footer-label">Follow me on</span>
      <div class="social-links">
        <!-- Replace the # hrefs below with your real profile URLs -->
        <a class="social-link" href="#" aria-label="TikTok" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.82c-.9-.98-1.4-2.26-1.4-3.62h-3.45v13.6c0 1.66-1.35 3-3.01 3-1.66 0-3.01-1.34-3.01-3s1.35-3 3.01-3c.31 0 .61.05.9.14V9.4a6.65 6.65 0 0 0-.9-.06 6.48 6.48 0 0 0 0 12.96 6.48 6.48 0 0 0 6.48-6.48V8.93a9.15 9.15 0 0 0 5.36 1.72V7.2c-1.5 0-2.89-.51-3.98-1.38Z"/></svg>
        </a>
        <a class="social-link" href="#" aria-label="LinkedIn" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124zM7.119 20.452H3.554V9h3.565v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003Z"/></svg>
        </a>
        <a class="social-link" href="#" aria-label="X (Twitter)" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>
        </a>
        <a class="social-link" href="#" aria-label="Instagram" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069Zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073Zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324Zm0 10.162a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881Z"/></svg>
        </a>
      </div>
    </footer>
  </main>

  <script src="js/mockData.js"></script>
  <script src="js/topicArt.js"></script>
  <script src="js/config.js"></script>
  <script src="js/newsApi.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
